<!-- OPTIONAL: Firebase sync. Leave the config as-is to run purely local
     (browser storage). Fill it in later to sync across devices. This is a
     module so it loads separately; the app does NOT wait on it. -->
<script type="module">
  try {
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    const { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } =
      await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
    const { getFirestore, doc, getDoc, setDoc } =
      await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");

    // ─── PASTE YOUR FIREBASE CONFIG HERE (later) ───
    const firebaseConfig = {
      apiKey: "PASTE_API_KEY",
      authDomain: "PASTE_PROJECT.firebaseapp.com",
      projectId: "PASTE_PROJECT_ID",
      storageBucket: "PASTE_PROJECT.appspot.com",
      messagingSenderId: "PASTE_SENDER_ID",
      appId: "PASTE_APP_ID",
    };

    if (String(firebaseConfig.apiKey).startsWith("PASTE_")) {
      // Not configured yet — app runs locally. Nothing to wire up.
      console.info("Firebase not configured; running on local storage.");
    } else {
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);
      const provider = new GoogleAuthProvider();
      window.VaultFirebase = {
        signIn: () => signInWithPopup(auth, provider),
        signOut: () => signOut(auth),
        onAuth: (cb) => onAuthStateChanged(auth, cb),
        loadFilm: async (uid, filmId) => {
          const snap = await getDoc(doc(db, "users", uid, "films", filmId));
          return snap.exists() ? snap.data() : null;
        },
        saveFilm: async (uid, filmId, data) => {
          await setDoc(doc(db, "users", uid, "films", filmId), data, { merge: true });
        },
      };
      window.dispatchEvent(new Event("vault-firebase-ready"));
    }
  } catch (err) {
    console.error("Firebase optional layer failed; app still runs locally.", err);
  }
</script>
