<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#060608">
<title>The Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--font-body,"Inter",system-ui,sans-serif);
    -webkit-font-smoothing:antialiased;min-height:100vh;
    background:var(--bg,#060608);color:var(--cream,#f0eef2);
    transition:background .35s ease,color .35s ease;
  }
  @media (prefers-reduced-motion: reduce){ *{animation:none!important;transition-duration:.001s!important} }
  a{color:inherit}
  .wrap{max-width:1080px;margin:0 auto;padding:0 18px 90px;position:relative;z-index:1}

  /* ===== base (home / neutral) ===== */
  body[data-theme="vault"]{
    --bg:#060608; --panel:#14141b; --panel-2:#1b1b24; --line:#2a2a35;
    --accent:#8fb4ff; --accent-2:#c9d6ff; --accent-ink:#0a1120; --mute:#8a8a98; --cream:#f0eef2;
    --red:#ff6b7a;
    --font-display:"Oswald",sans-serif; --font-body:"Inter",system-ui,sans-serif;
    --atmos:radial-gradient(1000px 500px at 15% -10%, rgba(255,45,85,.06), transparent 45%),radial-gradient(900px 500px at 85% 110%, rgba(46,166,255,.06), transparent 45%);
  }
  /* ===== per-film themes ===== */
  body[data-theme="roadhouse"]{--bg:#0a0608;--panel:#1a0f14;--panel-2:#231419;--line:#3d1f2b;--accent:#ff2d55;--accent-2:#00e0d0;--accent-ink:#0a0608;--mute:#a97e83;--cream:#f3e4d8;--red:#ff2d55;--font-display:"Oswald",sans-serif;--font-body:"Inter",sans-serif;--atmos:radial-gradient(1000px 520px at 20% -5%,rgba(255,45,85,.13),transparent 55%),radial-gradient(700px 700px at 100% 100%,rgba(0,224,208,.09),transparent 60%);}
  body[data-theme="karatekid"]{--bg:#0d1410;--panel:#152019;--panel-2:#1c2a22;--line:#2c4234;--accent:#e8b13d;--accent-2:#c0392b;--accent-ink:#0d1410;--mute:#9db89f;--cream:#f4efe4;--red:#c0392b;--font-display:"Cinzel",Georgia,serif;--font-body:"Inter",sans-serif;--atmos:radial-gradient(1000px 520px at 80% -5%,rgba(232,177,61,.14),transparent 55%),radial-gradient(700px 700px at 0% 100%,rgba(192,57,43,.10),transparent 60%);}
  body[data-theme="returntooz"]{--bg:#0a0a12;--panel:#141327;--panel-2:#1b1a33;--line:#2e2a52;--accent:#8b6fd6;--accent-2:#4ecb8f;--accent-ink:#0a0a12;--mute:#9a92c4;--cream:#e9e4f5;--red:#ff6b7a;--font-display:"Cormorant Garamond",Georgia,serif;--font-body:"Inter",sans-serif;--atmos:radial-gradient(1000px 520px at 30% -5%,rgba(139,111,214,.16),transparent 55%),radial-gradient(700px 700px at 100% 100%,rgba(78,203,143,.09),transparent 60%);}
  body[data-theme="topgun"]{--bg:#080a0f;--panel:#0f1620;--panel-2:#141d2a;--line:#1f3346;--accent:#ff8a1e;--accent-2:#2ea6ff;--accent-ink:#080a0f;--mute:#7d97ad;--cream:#eaf1f8;--red:#ff6b7a;--font-display:"Oswald",sans-serif;--font-body:"Inter",sans-serif;--atmos:linear-gradient(180deg,rgba(46,166,255,.08),transparent 30%),radial-gradient(700px 600px at 75% 100%,rgba(255,138,30,.13),transparent 55%);}
  body[data-theme="flightnavigator"]{--bg:#070b12;--panel:#0e1826;--panel-2:#132234;--line:#1e3350;--accent:#3ad6e0;--accent-2:#c9a2ff;--accent-ink:#070b12;--mute:#7d95b3;--cream:#e6f0fb;--red:#ff6b7a;--font-display:"Oswald",sans-serif;--font-body:"Inter",sans-serif;--atmos:radial-gradient(1000px 520px at 25% -5%,rgba(58,214,224,.13),transparent 55%),radial-gradient(700px 700px at 100% 100%,rgba(201,162,255,.10),transparent 60%);}
  body[data-theme="comingtoamerica"]{--bg:#100a04;--panel:#211609;--panel-2:#2b1e0d;--line:#453218;--accent:#f0b429;--accent-2:#e0592a;--accent-ink:#100a04;--mute:#c2a575;--cream:#faf0dc;--red:#e0592a;--font-display:"Cinzel",Georgia,serif;--font-body:"Inter",sans-serif;--atmos:radial-gradient(1000px 520px at 80% -5%,rgba(240,180,41,.15),transparent 55%),radial-gradient(700px 700px at 0% 100%,rgba(224,89,42,.10),transparent 60%);}
  body[data-theme="karatekid2"]{--bg:#0c1212;--panel:#132020;--panel-2:#1a2b2b;--line:#264040;--accent:#e0a53d;--accent-2:#3fa9a0;--accent-ink:#0c1212;--mute:#94b3ac;--cream:#eef4f0;--red:#ff6b7a;--font-display:"Cinzel",Georgia,serif;--font-body:"Inter",sans-serif;--atmos:radial-gradient(1000px 520px at 78% -5%,rgba(224,165,61,.13),transparent 55%),radial-gradient(700px 700px at 0% 100%,rgba(63,169,160,.10),transparent 60%);}
  body[data-theme="karatekid3"]{--bg:#120c0c;--panel:#201414;--panel-2:#2b1a1a;--line:#3f2626;--accent:#d63f3f;--accent-2:#e0a53d;--accent-ink:#120c0c;--mute:#b58f8a;--cream:#f4e9e6;--red:#d63f3f;--font-display:"Cinzel",Georgia,serif;--font-body:"Inter",sans-serif;--atmos:radial-gradient(1000px 520px at 80% -5%,rgba(214,63,63,.14),transparent 55%),radial-gradient(700px 700px at 0% 100%,rgba(224,165,61,.09),transparent 60%);}
  body[data-theme="troopbeverlyhills"]{--bg:#120810;--panel:#22111c;--panel-2:#2d1826;--line:#472138;--accent:#ff5fa2;--accent-2:#ffd24a;--accent-ink:#120810;--mute:#c48eae;--cream:#fceaf4;--red:#ff5fa2;--font-display:"Oswald",sans-serif;--font-body:"Inter",sans-serif;--atmos:radial-gradient(1000px 520px at 22% -5%,rgba(255,95,162,.15),transparent 55%),radial-gradient(700px 700px at 86% 100%,rgba(255,210,74,.11),transparent 60%);}
  body[data-theme="adventuresbabysitting"]{--bg:#080b14;--panel:#101728;--panel-2:#161f34;--line:#233150;--accent:#ff6b4a;--accent-2:#4ac6ff;--accent-ink:#080b14;--mute:#8497bd;--cream:#e8eefb;--red:#ff6b4a;--font-display:"Oswald",sans-serif;--font-body:"Inter",sans-serif;--atmos:linear-gradient(180deg,rgba(74,198,255,.08),transparent 30%),radial-gradient(700px 600px at 78% 100%,rgba(255,107,74,.13),transparent 55%);}

  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:var(--atmos,transparent);opacity:.9;transition:background .35s}

  /* ===== header ===== */
  header.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(7px);border-bottom:1px solid var(--line);transition:background .35s,border-color .35s}
  .top-inner{max-width:1080px;margin:0 auto;padding:14px 18px;display:flex;align-items:center;gap:14px}
  .logo{font-family:var(--font-display);font-weight:700;letter-spacing:.08em;font-size:22px;line-height:1;cursor:pointer;user-select:none;display:flex;align-items:center;gap:9px;text-transform:uppercase}
  .logo .mark{width:22px;height:22px;flex:none;position:relative}
  .logo .mark i{position:absolute;inset:0;border:2.5px solid var(--accent);border-radius:6px}
  .logo .mark i:nth-child(2){inset:5px;border-color:var(--accent-2);border-radius:3px;opacity:.8}
  .tagline{color:var(--mute);font-size:10.5px;letter-spacing:.24em;text-transform:uppercase}
  .spacer{flex:1}

  .crumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin:22px 0 6px}
  .crumbs b{color:var(--cream);font-weight:600}
  .crumbs .sep{opacity:.5}
  .crumb-btn{background:none;border:none;color:var(--accent);cursor:pointer;font-size:13px;padding:0;font-family:inherit}
  .crumb-btn:hover{text-decoration:underline}

  h1.page{font-family:var(--font-display);font-size:38px;margin:6px 0 2px;letter-spacing:.01em;font-weight:700;line-height:1.03}
  .sub{color:var(--mute);font-size:14px;margin-bottom:18px;line-height:1.5}
  .fieldlabel{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin:22px 0 10px}
  .fieldlabel:first-child{margin-top:0}

  .pills{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 26px}
  .pill{border:1px solid var(--line);background:var(--panel);color:var(--cream);border-radius:999px;padding:7px 14px;font-size:12.5px;letter-spacing:.03em;cursor:pointer;transition:.15s;font-family:inherit;display:inline-flex;align-items:center;gap:7px}
  .pill:hover{border-color:var(--accent)}
  .pill.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
  .pill .cnt{opacity:.55;font-size:11px}
  .pill.on .cnt{opacity:.8}

  /* ===== film cards ===== */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
  .card{position:relative;border:1px solid var(--cardline,var(--line));border-radius:16px;background:var(--cardbg,linear-gradient(180deg,var(--panel-2),var(--panel)));padding:20px;cursor:pointer;transition:.16s;overflow:hidden;min-height:190px}
  .card:hover{transform:translateY(-3px);border-color:var(--cardaccent);box-shadow:0 16px 36px -18px var(--cardglow)}
  .card .yr{font-size:11px;letter-spacing:.16em;color:var(--cardaccent2);text-transform:uppercase;font-weight:600}
  .card h3{font-family:var(--carddisplay);margin:9px 0 8px;font-size:26px;line-height:1.03;font-weight:700;color:var(--cardink);text-shadow:0 0 22px var(--cardglow);text-transform:var(--cardupper,none)}
  .card .tagline{font-family:var(--carddisplay);font-style:italic;color:var(--cardmute);font-size:14px;margin:0 0 12px;letter-spacing:0;text-transform:none}
  .card .tagrow{display:flex;gap:6px;flex-wrap:wrap}
  .microtag{font-size:10.5px;border-radius:999px;padding:3px 9px;color:var(--cardmute);background:rgba(0,0,0,.28)}
  .card .cardmeta{position:absolute;bottom:16px;right:18px;font-size:12px;color:var(--cardmute);display:flex;align-items:center;gap:10px}
  .card .cardmeta .rt{display:flex;align-items:center;gap:3px;color:var(--cardaccent)}
  .addcard{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;border-style:dashed;color:var(--mute);text-align:center;background:none}
  .addcard .plus{font-size:30px;color:var(--accent)}
  .addcard span{font-size:12.5px;max-width:170px}

  .stat-row{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 24px}
  .stat{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 16px;min-width:92px}
  .stat b{display:block;font-family:var(--font-display);font-size:24px;font-weight:700;color:var(--accent)}
  .stat span{font-size:11px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase}

  /* ===== tabs ===== */
  .tabs{display:flex;gap:6px;margin:4px 0 22px;border-bottom:1px solid var(--line)}
  .tab{background:none;border:none;font-family:inherit;color:var(--mute);cursor:pointer;font-size:14px;padding:11px 4px;margin-right:18px;border-bottom:2px solid transparent;transition:.14s;letter-spacing:.02em}
  .tab:hover{color:var(--cream)}
  .tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
  .tab .n{font-size:11px;color:var(--mute);margin-left:5px}

  /* ===== entry list (characters + scenes) ===== */
  .search{margin:0 0 16px;position:relative}
  .search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--cream);font-family:inherit;font-size:14px;padding:12px 14px 12px 40px;outline:none}
  .search input:focus{border-color:var(--accent)}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.5}
  .addrow{display:flex;gap:8px;margin-bottom:16px}
  .addrow input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--cream);font-family:inherit;font-size:14px;padding:12px 14px;outline:none}
  .addrow input:focus{border-color:var(--accent)}
  .btn-add{border:none;border-radius:12px;padding:0 18px;background:var(--accent);color:var(--accent-ink);font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}

  .entrylist{display:flex;flex-direction:column;gap:10px}
  .entry{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:9px}
  .entry.fav{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .entry-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .entry-name{font-family:var(--font-display);font-size:20px;color:var(--cream);font-weight:600;line-height:1.15}
  .entry-actions{display:flex;gap:6px;flex:none}
  .iconbtn{background:none;border:none;cursor:pointer;padding:2px;line-height:0;color:var(--mute);transition:.14s}
  .iconbtn:hover{color:var(--accent)}
  .iconbtn.on{color:var(--accent)}
  .iconbtn.del:hover{color:var(--red)}
  .entry-note-preview{font-size:12.5px;color:var(--mute);line-height:1.45}
  .stars{display:flex;gap:3px}
  .star{background:none;border:none;cursor:pointer;padding:1px;line-height:0;font-size:18px;color:rgba(255,255,255,.18);transition:.12s}
  .star.on{color:var(--accent)}
  .star:hover{transform:scale(1.1)}
  .tagchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .tchip{display:inline-flex;align-items:center;gap:4px;background:rgba(0,0,0,.3);border:1px solid var(--line);color:var(--accent-2);border-radius:999px;padding:2px 8px 2px 10px;font-size:11.5px}
  .tchip button{background:none;border:none;color:var(--mute);cursor:pointer;padding:0;line-height:0;font-size:12px}

  /* ===== moods ===== */
  .moodgrid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
  .mood{background:var(--panel);border:1px solid var(--line);color:var(--cream);border-radius:22px;padding:8px 16px;cursor:pointer;font-family:inherit;font-size:14px;transition:.13s}
  .mood:hover{border-color:var(--accent-2)}
  .mood.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700;transform:translateY(-1px)}
  .mood.custom{border-color:var(--accent-2)}

  .empty{color:var(--mute);text-align:center;padding:50px 20px;border:1px dashed var(--line);border-radius:16px}

  /* ===== drawer (entry detail) ===== */
  .scrim{position:fixed;inset:0;background:rgba(2,3,4,.72);z-index:200;opacity:0;pointer-events:none;transition:.2s}
  .scrim.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;z-index:201;right:0;top:0;height:100%;width:min(460px,100%);background:linear-gradient(180deg,var(--panel-2),var(--panel));border-left:1px solid var(--line);transform:translateX(100%);transition:transform .24s cubic-bezier(.3,.8,.3,1);display:flex;flex-direction:column}
  .drawer.open{transform:none}
  .drawer .dhead{padding:20px 20px 14px;border-bottom:1px solid var(--line);position:relative}
  .drawer .eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-2)}
  .drawer h2{font-family:var(--font-display);margin:6px 0 0;font-size:24px;line-height:1.15;font-weight:700}
  .drawer .dbody{padding:20px;overflow-y:auto;flex:1}
  .drawer .x{position:absolute;top:16px;right:16px;background:none;border:1px solid var(--line);color:var(--cream);width:34px;height:34px;border-radius:9px;cursor:pointer;font-size:16px;line-height:1}
  .drawer .x:hover{border-color:var(--red);color:var(--red)}
  textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--cream);font-family:inherit;font-size:14px;padding:12px;min-height:90px;resize:vertical;outline:none;line-height:1.5}
  textarea:focus{border-color:var(--accent)}
  .kwwrap{display:flex;flex-wrap:wrap;gap:7px;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:9px;min-height:46px}
  .kwwrap input{flex:1;min-width:110px;background:none;border:none;outline:none;color:var(--cream);font-family:inherit;font-size:14px;padding:4px}
  .drawer .dfoot{padding:16px 20px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
  .btn{border:none;border-radius:11px;padding:13px 18px;font-family:inherit;font-weight:700;cursor:pointer;font-size:14px;transition:.14s}
  .btn.save{background:var(--accent);color:var(--accent-ink);flex:1}
  .btn.save:hover{filter:brightness(1.08)}
  .btn.ghost{background:none;border:1px solid var(--line);color:var(--mute)}
  .btn.ghost:hover{color:var(--red);border-color:var(--red)}
  .saved-note{font-size:11px;color:var(--accent);opacity:0;transition:.2s}
  .saved-note.show{opacity:1}
  /* ===== voice dictation mic ===== */
  .fieldlabel-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .micbtn{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);color:var(--mute);border-radius:999px;padding:5px 12px 5px 10px;cursor:pointer;font-family:inherit;font-size:11.5px;letter-spacing:.02em;transition:.14s;text-transform:none}
  .micbtn:hover{border-color:var(--accent);color:var(--cream)}
  .micbtn svg{width:14px;height:14px;flex:none}
  .micbtn.listening{background:var(--red);border-color:var(--red);color:#fff}
  .micbtn.listening .micdot{width:7px;height:7px;border-radius:50%;background:#fff;animation:micpulse 1s infinite}
  @keyframes micpulse{0%,100%{opacity:1}50%{opacity:.3}}
  .micbtn.unsupported{opacity:.4;cursor:not-allowed}
  /* ===== cross-links (characters in a scene / scenes for a character) ===== */
  .linkchips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:6px}
  .linkchip{border:1px solid var(--line);background:var(--panel);color:var(--cream);border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.13s}
  .linkchip:hover{border-color:var(--accent-2)}
  .linkchip.on{background:var(--accent-2);color:var(--accent-ink);border-color:var(--accent-2);font-weight:700}
  .linknotes{display:flex;flex-direction:column;gap:10px;margin-top:4px}
  .linknote{border:1px solid var(--line);background:rgba(0,0,0,.18);border-radius:12px;padding:11px 12px}
  .linknote-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
  .linknote-name{font-family:var(--font-display);font-size:15px;font-weight:600;color:var(--cream)}
  .linknote-x{background:none;border:none;color:var(--mute);cursor:pointer;font-size:13px;line-height:1;padding:0}
  .linknote-x:hover{color:var(--red)}
  .linknote textarea{min-height:56px;font-size:13px;padding:9px 10px}
  .linknote-mic{display:inline-flex;align-items:center;gap:5px;background:none;border:1px solid var(--line);color:var(--mute);border-radius:999px;padding:3px 9px 3px 8px;cursor:pointer;font-family:inherit;font-size:10.5px;transition:.14s}
  .linknote-mic:hover{border-color:var(--accent);color:var(--cream)}
  .linknote-mic.listening{background:var(--red);border-color:var(--red);color:#fff}
  .linknote-mic svg{width:12px;height:12px}
  .linknote-mic .micdot{width:6px;height:6px;border-radius:50%;background:#fff;animation:micpulse 1s infinite}
  .link-empty{font-size:12px;color:var(--mute)}
  .bigstars{display:flex;gap:5px}
  .bigstar{background:none;border:none;cursor:pointer;padding:2px;line-height:0;font-size:30px;color:rgba(255,255,255,.18);transition:.12s}
  .bigstar.on{color:var(--accent)}

  /* ===== overall film rating + dashboard ===== */
  .filmrate{display:flex;align-items:center;gap:12px;margin:6px 0 18px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
  .filmrate .lbl{font-size:13px;color:var(--mute)}
  .synopsis{font-size:14px;line-height:1.6;color:var(--cream);opacity:.9;margin:0 0 18px;background:rgba(0,0,0,.2);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:12px 14px}
  .dash{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:20px}
  .dash h3{display:flex;align-items:center;gap:8px;margin:0 0 16px;font-family:var(--font-display);font-size:18px;font-weight:600}
  .dash-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
  .dash-num{text-align:center;background:rgba(0,0,0,.25);border-radius:10px;padding:12px 6px}
  .dash-num b{display:block;font-family:var(--font-display);font-size:26px;color:var(--accent);font-weight:700}

const keyToId = (k)=>encodeURIComponent(k);

const userCol = ()=>collection(db,"users",uid,"kv");
async function sGet(key){ try{ const s=await getDoc(userDoc(key)); return s.exists()?s.data().v:null; }catch(e){ console.error("sGet",key,e); return null; } }
async function sSet(key,value){ try{ await setDoc(userDoc(key),{k:key,v:value}); }catch(e){ console.error("sSet",key,e); } }
async function sDel(key){ try{ await deleteDoc(userDoc(key)); }catch(e){ console.error("sDel",key,e); } }
async function sList(prefix){ try{ const snap=await getDocs(userCol()); const out=[]; snap.forEach(d=>{ const k=d.data().k; if(k&&(!prefix||k.startsWith(prefix))) out.push(k); }); return out; }catch(e){ console.error("sList",prefix,e); return []; } }

/* ===========================================================================

   =========================================================================== */
function seedFilm(film){
  const stamp = (arr,cat)=> (arr||[]).map((e,i)=>({ id:`${cat}-${i}-${Date.now()}-${Math.random().toString(36).slice(2,6)}`, name:e.name, note:e.note||"", rating:0, favorite:false, tags:[] }));
  return { characters:stamp(film.seed.characters,"c"), scenes:stamp(film.seed.scenes,"s"), moodsSelected:[], moodsCustom:[], filmRating:0 };
}
async function loadFilmData(filmId){
  if(filmData[filmId]) return filmData[filmId];
  let d = await sGet("v:film:"+filmId);
  if(!d){ d = seedFilm(FILMS[filmId]); await sSet("v:film:"+filmId, d); }
  filmData[filmId] = d;
  return d;
}
async function saveFilmData(filmId){ await sSet("v:film:"+filmId, filmData[filmId]); }

/* ===========================================================================
   BOOT
   =========================================================================== */
async function boot(){
  // Render home immediately — don't block on the network.
  render();
  // ONE round-trip pulls every saved film doc at once.
  const all = await sGetAll("v:film:");
  const toSeed = [];
  for(const id of Object.keys(FILMS)){
    const saved = all["v:film:"+id];
    if(saved){ filmData[id] = saved; }
    else { const d = seedFilm(FILMS[id]); filmData[id] = d; toSeed.push([id,d]); }
  }
  render(); // counts/ratings now populated
  // Seed any first-run films in parallel (writes don't block the UI).
  if(toSeed.length){ await Promise.all(toSeed.map(([id,d])=>sSet("v:film:"+id, d))); }
}

}

function renderEntries(id, cat){

function renderDash(id){
  const d=filmData[id];

  const avg=rated.length?(rated.reduce((s,e)=>s+e.rating,0)/rated.length):0;
  const top=[...rated].sort((a,b)=>b.rating-a.rating).slice(0,3);
  const tagCount={}; all.forEach(e=>(e.tags||[]).forEach(t=>tagCount[t]=(tagCount[t]||0)+1));
  const topTags=Object.entries(tagCount).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const moods=d.moodsSelected||[];
  return `<div class="dash">
    <h3>▤ Your take, by the numbers</h3>
    <div class="dash-nums">
      <div class="dash-num"><b>${rated.length}</b><span>rated</span></div>
      <div class="dash-num"><b>${avg?avg.toFixed(1):'—'}</b><span>avg stars</span></div>
      <div class="dash-num"><b>${favs.length}</b><span>favorites</span></div>

    ${top.length?`<div class="dash-lbl">Highest rated</div>${top.map(e=>`<div class="dbar"><div class="dbar-top"><span>${escapeHtml(e.name)}</span><span style="color:var(--cream)">${e.rating}</span></div><div class="dbar-track"><i style="width:${e.rating/5*100}%"></i></div></div>`).join("")}`:''}

  // cross-links: characters (if this is a scene) or scenes (if this is a character)

function renderDraftTags(){
  const wrap=document.getElementById("d-kwwrap"); wrap.querySelectorAll(".tchip").forEach(n=>n.remove());
  const input=document.getElementById("d-kwinput");
  draft.tags.forEach((t,idx)=>{ const el=document.createElement("span"); el.className="tchip"; el.innerHTML=`${escapeHtml(t)} <button aria-label="remove">✕</button>`;
    el.querySelector("button").onclick=(ev)=>{ ev.stopPropagation(); draft.tags.splice(idx,1); renderDraftTags(); }; wrap.insertBefore(el,input); });
}

// ---- cross-links: tag characters inside a scene (or scenes inside a character), each with its own note ----
function otherCat(cat){ return cat==="scenes" ? "characters" : "scenes"; }
function renderLinks(filmId, cat){
  const label=document.getElementById("d-links-label");
  const chipsWrap=document.getElementById("d-linkchips");
  const notesWrap=document.getElementById("d-linknotes");
  // only scenes<->characters link; moods handled elsewhere
  if(cat!=="scenes" && cat!=="characters"){ label.style.display="none"; chipsWrap.innerHTML=""; notesWrap.innerHTML=""; return; }
  const oc=otherCat(cat);
  const d=filmData[filmId];
  const others=(d[oc]||[]);
  if(!draft.links) draft.links={};
  label.style.display="";
  label.innerHTML = cat==="scenes"
    ? 'Characters in this scene <span style="text-transform:none;letter-spacing:0">(tap to tag, then note what they did)</span>'
    : 'Scenes for this character <span style="text-transform:none;letter-spacing:0">(tap to tag, then note their moment)</span>';
  if(!others.length){ chipsWrap.innerHTML=`<span class="link-empty">No ${oc} yet — add some on the ${oc} tab first.</span>`; notesWrap.innerHTML=""; return; }
  // chips
  chipsWrap.innerHTML=others.map(o=>`<button class="linkchip ${draft.links[o.id]!==undefined?'on':''}" data-link="${o.id}">${escapeHtml(o.name)}</button>`).join("");
  chipsWrap.querySelectorAll(".linkchip").forEach(b=>b.onclick=()=>{
    const id=b.dataset.link;
    if(draft.links[id]!==undefined) delete draft.links[id];   // untag
    else draft.links[id]="";                                   // tag with empty note
    renderLinkNotes(filmId, cat);
    b.classList.toggle("on", draft.links[id]!==undefined);
  });
  renderLinkNotes(filmId, cat);
}
function renderLinkNotes(filmId, cat){
  const notesWrap=document.getElementById("d-linknotes");
  const oc=otherCat(cat);
  const d=filmData[filmId];
  const nameOf=(id)=>{ const o=(d[oc]||[]).find(x=>x.id===id); return o?o.name:"(removed)"; };
  const ids=Object.keys(draft.links||{});
  if(!ids.length){ notesWrap.innerHTML=""; return; }
  notesWrap.innerHTML=ids.map(id=>{
    const taId="lnote-"+id, micId="lmic-"+id;
    return `<div class="linknote">
      <div class="linknote-head">
        <span class="linknote-name">${escapeHtml(nameOf(id))}</span>
        <span style="display:flex;gap:8px;align-items:center">
          <button class="linknote-mic" id="${micId}" type="button" title="Dictate this note">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>Speak
          </button>
          <button class="linknote-x" data-unlink="${id}" title="Remove">✕</button>
        </span>
      </div>
      <textarea id="${taId}" placeholder="What ${cat==='scenes'?'they did in this scene':'happens in this scene'}…">${escapeHtml(draft.links[id]||"")}</textarea>
    </div>`;
  }).join("");
  // wire note textareas
  ids.forEach(id=>{
    const ta=document.getElementById("lnote-"+id);
    if(ta) ta.oninput=(ev)=>{ draft.links[id]=ev.target.value; };
    wireDictation("lmic-"+id, "lnote-"+id, (val)=>{ draft.links[id]=val; });
  });
  // wire unlink buttons
  notesWrap.querySelectorAll("[data-unlink]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.unlink; delete draft.links[id];
    renderLinks(filmId, cat); // full refresh so the chip de-highlights too
  });
}
async function saveEntry(){
  if(!editing) return;
  const d=filmData[editing.filmId]; const arr=d[editing.cat]; const i=arr.findIndex(x=>x.id===editing.id);
  if(i>=0){ arr[i]={...arr[i],rating:draft.rating,note:draft.note,tags:draft.tags,favorite:draft.favorite,links:draft.links||{}}; }
  // Mirror the tag onto the other side so a scene tagged on a character also
  // shows up when you open that scene (note text stays per-side).
  syncReciprocalLinks(editing.filmId, editing.cat, editing.id, draft.links||{});
  await saveFilmData(editing.filmId);
  document.getElementById("d-saved").classList.add("show");
  setTimeout(()=>{ closeDrawer(); render(); },340);
}
// Ensure the other entry lists this one back (membership only; each side keeps its own note).
function syncReciprocalLinks(filmId, cat, myId, links){
  const d=filmData[filmId]; const oc=otherCat(cat);
  const others=d[oc]||[];
  const linkedIds=new Set(Object.keys(links));
  others.forEach(o=>{
    if(!o.links) o.links={};
    if(linkedIds.has(o.id)){
      if(o.links[myId]===undefined) o.links[myId]="";   // add back-link, empty note
    } else {
      if(o.links[myId]!==undefined) delete o.links[myId]; // removed here -> remove there
    }
  });
}
async function deleteEntry(){
  if(!editing) return;
  const d=filmData[editing.filmId]; d[editing.cat]=d[editing.cat].filter(x=>x.id!==editing.id);
  await saveFilmData(editing.filmId); closeDrawer(); render();
}
/* ===========================================================================
   VOICE DICTATION  (continuous — stops only when YOU tap stop)
   =========================================================================== */
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
let dictation = null; // { rec, btn, ta, active }
const MIC_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>';
const STOP_ICON = '<span class="micdot"></span>';

function stopDictation(){
  if(!dictation) return;
  const { rec, btn } = dictation;
  dictation.active = false;          // signal: do NOT auto-restart
  try{ rec.stop(); }catch(e){}
  if(btn){
    btn.classList.remove("listening");
    btn.innerHTML = MIC_ICON + '<span class="miclabel">Speak</span>';
  }
  dictation = null;
}

function startDictation(btn, ta, onText){
  if(!SpeechRec){ return; }
  // If already listening (this or another field), stop first.
  stopDictation();
  const rec = new SpeechRec();
  rec.continuous = true;
  rec.interimResults = true;
  rec.lang = "en-US";
  dictation = { rec, btn, ta, active:true };

  // ensure text ends with a space before we append dictation
  const needsSpace = ()=> ta.value.length && !/\s$/.test(ta.value);

  rec.onresult = (ev)=>{
    let finalChunk = "";
    for(let i=ev.resultIndex; i<ev.results.length; i++){
      const res = ev.results[i];
      if(res.isFinal) finalChunk += res[0].transcript;
    }
    if(finalChunk){
      let add = finalChunk.replace(/\s+/g," ").trim();
      if(add){
        ta.value = (ta.value + (needsSpace()?" ":"") + add).replace(/\s{2,}/g," ");
        if(onText) onText(ta.value);
      }
    }
  };

  // The API stops itself on silence; if the user hasn't tapped stop, restart it.
  rec.onend = ()=>{
    if(dictation && dictation.active){
      try{ rec.start(); }catch(e){ /* start can throw if called too fast; ignore */ }
    }
  };
  rec.onerror = (e)=>{
    // 'no-speech' / 'aborted' are normal; keep going unless it's fatal or user stopped
    if(e.error==="not-allowed" || e.error==="service-not-allowed"){
      alert("Microphone access was blocked. Allow mic permission for this site to use voice notes.");
      stopDictation();
    }
  };

  try{ rec.start(); }
  catch(e){ dictation=null; return; }

  btn.classList.add("listening");
  btn.innerHTML = STOP_ICON + '<span class="miclabel">Stop</span>';
}

// Attach a mic button to a textarea. onText is called with updated value.
function wireDictation(btnId, taId, onText){
  const btn = document.getElementById(btnId);
  const ta = document.getElementById(taId);
  if(!btn || !ta) return;
  if(!SpeechRec){
    btn.classList.add("unsupported");
    btn.title = "Voice input isn't supported in this browser (try Chrome).";
    btn.onclick = ()=> alert("Voice dictation isn't supported in this browser. Chrome or Edge on desktop, or Chrome on Android, work best.");
    return;
  }
  btn.onclick = ()=>{
    // toggle: if THIS field is listening, stop; otherwise start on this field
    if(dictation && dictation.ta === ta){ stopDictation(); }
    else { startDictation(btn, ta, onText); }
  };
}

function closeDrawer(){ stopDictation(); document.getElementById("scrim").classList.remove("open"); document.getElementById("drawer").classList.remove("open"); document.getElementById("drawer").setAttribute("aria-hidden","true"); editing=null; }

/* ===========================================================================
   INLINE ACTIONS
   =========================================================================== */
async function setStar(filmId,cat,eid,n){
  const d=filmData[filmId]; const e=d[cat].find(x=>x.id===eid); if(!e) return;
  e.rating=e.rating===n?0:n; await saveFilmData(filmId); render();
}
async function toggleFav(filmId,cat,eid){
  const d=filmData[filmId]; const e=d[cat].find(x=>x.id===eid); if(!e) return;
  e.favorite=!e.favorite; await saveFilmData(filmId); render();
}
async function delEntry(filmId,cat,eid){
  const d=filmData[filmId]; d[cat]=d[cat].filter(x=>x.id!==eid); await saveFilmData(filmId); render();
}
async function addEntry(filmId,cat,name){
  name=name.trim(); if(!name) return;
  const d=filmData[filmId];
  d[cat].unshift({ id:`n-${Date.now()}-${Math.random().toString(36).slice(2,6)}`, name, rating:0, note:"", favorite:false, tags:[] });
  await saveFilmData(filmId); render();
}
async function setFilmRating(filmId,n){
  const d=filmData[filmId]; d.filmRating=(d.filmRating===n)?0:n; await saveFilmData(filmId); render();
}
async function toggleMood(filmId,m){
  const d=filmData[filmId]; const sel=d.moodsSelected||(d.moodsSelected=[]);
  const i=sel.indexOf(m); if(i>=0) sel.splice(i,1); else sel.push(m);
  await saveFilmData(filmId); render();
}
async function addMood(filmId,m){
  m=m.trim(); if(!m) return;
  const d=filmData[filmId]; const custom=d.moodsCustom||(d.moodsCustom=[]); const sel=d.moodsSelected||(d.moodsSelected=[]);
  const exists=[...SHARED_MOODS,...custom].some(p=>p.toLowerCase()===m.toLowerCase());
  if(!exists) custom.push(m);
  if(!sel.includes(m)) sel.push(m);
  await saveFilmData(filmId); render();
}
async function clearMoods(filmId){ const d=filmData[filmId]; d.moodsSelected=[]; await saveFilmData(filmId); render(); }

/* ===========================================================================
   WIRE
   =========================================================================== */
function wire(){
  // home
  document.querySelectorAll(".card[data-film]").forEach(c=>c.onclick=()=>openFilm(c.dataset.film));
  document.querySelectorAll(".pill[data-genre]").forEach(p=>p.onclick=()=>{ genreFilter=p.dataset.genre||null; render(); });
  // film: category tabs
  document.querySelectorAll(".tab[data-cat]").forEach(t=>t.onclick=()=>{ activeCat=t.dataset.cat; query=""; favOnly=false; render(); });
  // film rating
  document.querySelectorAll("[data-filmstar]").forEach(b=>b.onclick=()=>setFilmRating(view.id, parseInt(b.dataset.filmstar)));
  // dashboard toggle
  const dt=document.getElementById("dashToggle"); if(dt) dt.onclick=()=>{ showDash=!showDash; render(); };
  // entries
  document.querySelectorAll("[data-open]").forEach(el=>el.onclick=()=>openEntry(view.id, activeCat, el.dataset.open));
  document.querySelectorAll("[data-star]").forEach(b=>b.onclick=(ev)=>{ ev.stopPropagation(); setStar(view.id, activeCat, b.dataset.eid, parseInt(b.dataset.star)); });
  document.querySelectorAll("[data-fav]").forEach(b=>b.onclick=(ev)=>{ ev.stopPropagation(); toggleFav(view.id, activeCat, b.dataset.fav); });
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=(ev)=>{ ev.stopPropagation(); delEntry(view.id, activeCat, b.dataset.del); });
  const es=document.getElementById("entrySearch"); if(es) es.oninput=(e)=>{ query=e.target.value; const pos=e.target.selectionStart; render(); const n=document.getElementById("entrySearch"); if(n){n.focus();n.setSelectionRange(pos,pos);} };
  const ft=document.getElementById("favToggle"); if(ft) ft.onclick=()=>{ favOnly=!favOnly; render(); };
  const eab=document.getElementById("entryAddBtn"), eai=document.getElementById("entryAdd");
  if(eab&&eai){ eab.onclick=()=>addEntry(view.id, activeCat, eai.value); eai.onkeydown=(e)=>{ if(e.key==="Enter") addEntry(view.id, activeCat, eai.value); }; }
  // moods
  document.querySelectorAll("[data-mood]").forEach(b=>b.onclick=()=>toggleMood(view.id, b.dataset.mood));
  const mab=document.getElementById("moodAddBtn"), mai=document.getElementById("moodAdd");
  if(mab&&mai){ mab.onclick=()=>addMood(view.id, mai.value); mai.onkeydown=(e)=>{ if(e.key==="Enter") addMood(view.id, mai.value); }; }
  const mc=document.getElementById("moodClear"); if(mc) mc.onclick=()=>clearMoods(view.id);
}
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeDrawer(); });

/* ===========================================================================
   AUTH GATE + STARTUP
   =========================================================================== */
const gate=document.getElementById("authgate");
const chip=document.getElementById("userchip");
const errEl=document.getElementById("autherr");
let booted=false;

document.getElementById("googleBtn").onclick=async()=>{
  errEl.textContent="";
  try{ await signInWithPopup(auth, provider); }
  catch(e){ console.error(e); errEl.textContent=(e&&e.code==="auth/popup-blocked")?"Popup blocked — allow popups for this site and try again.":"Sign-in failed. Check the console for details."; }
};
function renderChip(user){
  const photo=user.photoURL?`<img src="${user.photoURL}" alt="" referrerpolicy="no-referrer">`:"";
  chip.innerHTML=`${photo}<button class="signout" id="signoutBtn">Sign out</button>`;
  chip.style.display="flex";
  document.getElementById("signoutBtn").onclick=()=>signOut(auth);
}
onAuthStateChanged(auth, async (user)=>{
  if(user){
    uid=user.uid; gate.classList.add("hide"); renderChip(user);
    if(!booted){ booted=true; await boot(); }
  } else {
    uid=null; booted=false; filmData={}; chip.style.display="none"; gate.classList.remove("hide");
  }
});
</script>
