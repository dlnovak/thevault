<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, setDoc
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // ─────────────────────────────────────────────────────────────
  // 1) PASTE YOUR FIREBASE CONFIG HERE
  //    Firebase Console → Project settings → General → Your apps → Web app
  //    (These keys are safe to expose publicly; access is controlled by
  //     Firestore security rules, not by hiding the config.)
  // ─────────────────────────────────────────────────────────────
  const firebaseConfig = {
    apiKey: "PASTE_API_KEY",
    authDomain: "PASTE_PROJECT.firebaseapp.com",
    projectId: "PASTE_PROJECT_ID",
    storageBucket: "PASTE_PROJECT.appspot.com",
    messagingSenderId: "PASTE_SENDER_ID",
    appId: "PASTE_APP_ID",
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  // Expose a tiny bridge for the React app (which runs via Babel below).
  // All Firestore access goes through this object.
  window.VaultFirebase = {
    auth,
    signIn: () => signInWithPopup(auth, provider),
    signOut: () => signOut(auth),
    onAuth: (cb) => onAuthStateChanged(auth, cb),
    // Per-user, per-film document: users/{uid}/films/{filmId}
    loadFilm: async (uid, filmId) => {
      const ref = doc(db, "users", uid, "films", filmId);
      const snap = await getDoc(ref);
      return snap.exists() ? snap.data() : null;
    },
    saveFilm: async (uid, filmId, data) => {
      const ref = doc(db, "users", uid, "films", filmId);
      await setDoc(ref, data, { merge: true });
    },
  };

  // Signal readiness so the app can boot once Firebase is wired up.
  window.dispatchEvent(new Event("vault-firebase-ready"));
</script>

// ═══════════════════════════════════════════════════════════════
// Firebase-backed storage (replaces window.storage / localStorage)
// ═══════════════════════════════════════════════════════════════
function seedData(film) {
  const stamp = (arr, cat) =>
    (arr || []).map((e, i) => ({
      id: `${cat}-${i}-${Date.now()}`, name: e.name, note: e.note || "",
      rating: 0, favorite: false, tags: [],
    }));
  return {
    characters: stamp(film.seed.characters, "c"),
    scenes: stamp(film.seed.scenes, "s"),
    moodsSelected: [],
    moodsCustom: [],
    filmRating: 0,
  };
}

// Load a film's data for the signed-in user; seed + save on first access.
async function loadFilm(uid, film) {
  try {
    const existing = await window.VaultFirebase.loadFilm(uid, film.id);
    if (existing) return existing;
  } catch (e) { console.error("load failed", e); }
  const seeded = seedData(film);
  try { await window.VaultFirebase.saveFilm(uid, film.id, seeded); } catch (e) { console.error("seed save failed", e); }
  return seeded;
}
async function saveFilm(uid, id, data) {
  try { await window.VaultFirebase.saveFilm(uid, id, data); }
  catch (e) { console.error("save failed", e); }
}

// Star rating
// ═══════════════════════════════════════════════════════════════
function Stars({ value, onChange, accent, size = 18 }) {
  const [hover, setHover] = useState(0);
  return (
    <div style={{ display: "flex", gap: 2 }}>
      {[1, 2, 3, 4, 5].map((n) => {
        const active = (hover || value) >= n;
        return (
          <button key={n} onClick={() => onChange(n === value ? 0 : n)}
            onMouseEnter={() => setHover(n)} onMouseLeave={() => setHover(0)}
            aria-label={`Rate ${n} of 5`}
            style={{ background: "none", border: "none", cursor: "pointer", padding: 1,
              lineHeight: 0, color: active ? accent : "rgba(255,255,255,0.16)",
              transition: "color .12s, transform .12s", transform: active ? "scale(1.06)" : "scale(1)" }}>
            <Star size={size} fill={active ? accent : "none"} strokeWidth={active ? 0 : 1.6} color={active ? accent : "currentColor"} />
          </button>
        );
      })}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// Tag editor
// ═══════════════════════════════════════════════════════════════
function TagRow({ tags, onAdd, onRemove, theme }) {
  const [input, setInput] = useState("");
  const [open, setOpen] = useState(false);
  const add = () => { const t = input.trim(); if (t && !tags.includes(t)) onAdd(t); setInput(""); setOpen(false); };
  return (
    <div style={{ display: "flex", flexWrap: "wrap", gap: 6, alignItems: "center" }}>
      {tags.map((t) => (
        <span key={t} style={{ display: "inline-flex", alignItems: "center", gap: 4,
          background: "rgba(0,0,0,0.3)", border: `1px solid ${theme.panelBorder}`,
          color: theme.accent2, borderRadius: 20, padding: "2px 8px 2px 10px",
          fontFamily: theme.body, fontSize: 11.5 }}>
          {t}
          <button onClick={() => onRemove(t)} aria-label={`Remove ${t}`}
            style={{ background: "none", border: "none", color: theme.sub, cursor: "pointer",
              padding: 0, lineHeight: 0, display: "flex" }}><X size={12} /></button>
        </span>
      ))}
      {open ? (
        <input autoFocus value={input} onChange={(e) => setInput(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") add(); if (e.key === "Escape") { setOpen(false); setInput(""); } }}
          onBlur={add} placeholder="tag…"
          style={{ background: "rgba(0,0,0,0.3)", border: `1px solid ${theme.accent}`,
            borderRadius: 20, color: theme.ink, fontFamily: theme.body, fontSize: 11.5,
            padding: "3px 10px", width: 80 }} />
      ) : (
        <button onClick={() => setOpen(true)}
          style={{ display: "inline-flex", alignItems: "center", gap: 3, background: "none",
            border: `1px dashed ${theme.panelBorder}`, color: theme.sub, borderRadius: 20,
            padding: "2px 9px", cursor: "pointer", fontFamily: theme.body, fontSize: 11.5 }}>
          <Tag size={11} /> tag
        </button>
      )}
    </div>
  );
}

      borderRadius: 12, padding: "14px 16px", marginBottom: 10,
      display: "flex", flexDirection: "column", gap: 9 }}>
      <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 10 }}>
        <div style={{ fontFamily: theme.display, fontSize: 20, color: theme.ink, fontWeight: 600, lineHeight: 1.15 }}>
          {entry.name}
        </div>
        <div style={{ display: "flex", gap: 4, flexShrink: 0 }}>
          <button onClick={() => onUpdate({ favorite: !entry.favorite })} aria-label="Favorite"
            style={{ background: "none", border: "none", cursor: "pointer", padding: 2, lineHeight: 0,
              color: entry.favorite ? theme.accent : theme.sub, opacity: entry.favorite ? 1 : 0.5 }}>
            <Heart size={16} fill={entry.favorite ? theme.accent : "none"} color={entry.favorite ? theme.accent : "currentColor"} />
          </button>
          <button onClick={onDelete} aria-label="Delete"
            style={{ background: "none", border: "none", color: theme.sub, cursor: "pointer",
              padding: 2, opacity: 0.5, lineHeight: 0 }}><Trash2 size={16} /></button>
        </div>
      </div>
      <Stars value={entry.rating} onChange={(r) => onUpdate({ rating: r })} accent={theme.accent} />
      <textarea value={entry.note} onChange={(e) => onUpdate({ note: e.target.value })}
        placeholder="Why does this land? What makes it work…" rows={entry.note ? 2 : 1}
        style={{ background: "rgba(0,0,0,0.25)", border: `1px solid ${theme.panelBorder}`,
          borderRadius: 8, color: theme.ink, fontFamily: theme.body, fontSize: 13.5,
          padding: "8px 10px", resize: "vertical", width: "100%",
          boxSizing: "border-box", lineHeight: 1.5 }} />
      <TagRow tags={entry.tags || []} theme={theme}
        onAdd={(t) => onUpdate({ tags: [...(entry.tags || []), t] })}
        onRemove={(t) => onUpdate({ tags: (entry.tags || []).filter((x) => x !== t) })} />
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// Stats dashboard
// ═══════════════════════════════════════════════════════════════
function Dashboard({ data, theme }) {
  const stats = useMemo(() => {
    const all = [...data.characters, ...data.scenes];
    const rated = all.filter((e) => e.rating > 0);
    const favs = all.filter((e) => e.favorite);
    const avg = rated.length ? (rated.reduce((s, e) => s + e.rating, 0) / rated.length) : 0;
    const top = [...rated].sort((a, b) => b.rating - a.rating).slice(0, 3);
    const tagCount = {};
    all.forEach((e) => (e.tags || []).forEach((t) => (tagCount[t] = (tagCount[t] || 0) + 1)));
    const topTags = Object.entries(tagCount).sort((a, b) => b[1] - a[1]).slice(0, 6);
    const moods = data.moodsSelected || [];
    return { total: all.length, rated: rated.length, favs, avg, top, topTags, moods };
  }, [data]);

  const Bar = ({ label, val, max, color }) => (
    <div style={{ marginBottom: 8 }}>
      <div style={{ display: "flex", justifyContent: "space-between", fontFamily: theme.body,
        fontSize: 12, color: theme.sub, marginBottom: 3 }}>
        <span>{label}</span><span style={{ color: theme.ink }}>{val}</span>
      </div>
      <div style={{ height: 6, background: "rgba(0,0,0,0.35)", borderRadius: 4, overflow: "hidden" }}>
        <div style={{ height: "100%", width: `${max ? (val / max) * 100 : 0}%`,
          background: color, borderRadius: 4, transition: "width .4s" }} />
      </div>
    </div>
  );

  return (
    <div className="fadein" style={{ background: theme.panel, border: `1px solid ${theme.panelBorder}`,
      borderRadius: 14, padding: 18, marginBottom: 20 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 16,
        fontFamily: theme.display, fontSize: 18, color: theme.ink, fontWeight: 600 }}>
        <BarChart3 size={18} color={theme.accent} /> Your take, by the numbers
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 12, marginBottom: 16 }}>
        {[
          { n: stats.rated, l: "rated" },
          { n: stats.avg ? stats.avg.toFixed(1) : "—", l: "avg stars" },
          { n: stats.favs.length, l: "favorites" },
        ].map((s, i) => (
          <div key={i} style={{ textAlign: "center", background: "rgba(0,0,0,0.25)",
            borderRadius: 10, padding: "12px 6px" }}>
            <div style={{ fontFamily: theme.display, fontSize: 26, color: theme.accent, fontWeight: 700 }}>{s.n}</div>
            <div style={{ fontFamily: theme.body, fontSize: 11, color: theme.sub, letterSpacing: 0.5 }}>{s.l}</div>
          </div>
        ))}
      </div>

      {stats.top.length > 0 && (
        <div style={{ marginBottom: 14 }}>
          <div style={{ fontFamily: theme.body, fontSize: 12, letterSpacing: 1.5, textTransform: "uppercase",
            color: theme.accent2, marginBottom: 8, display: "flex", alignItems: "center", gap: 5 }}>
            <Award size={13} /> Highest rated
          </div>
          {stats.top.map((e) => (
            <Bar key={e.id} label={e.name} val={e.rating} max={5} color={theme.accent} />
          ))}
        </div>
      )}

      {stats.topTags.length > 0 && (
        <div style={{ marginBottom: stats.moods.length > 0 ? 14 : 0 }}>
          <div style={{ fontFamily: theme.body, fontSize: 12, letterSpacing: 1.5, textTransform: "uppercase",
            color: theme.accent2, marginBottom: 8 }}>Most-used tags</div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
            {stats.topTags.map(([t, c]) => (
              <span key={t} style={{ background: "rgba(0,0,0,0.3)", border: `1px solid ${theme.panelBorder}`,
                color: theme.ink, borderRadius: 20, padding: "3px 11px", fontFamily: theme.body, fontSize: 12 }}>
                {t} <span style={{ color: theme.sub }}>×{c}</span>
              </span>
            ))}
          </div>
        </div>
      )}

      {stats.moods.length > 0 && (
        <div>
          <div style={{ fontFamily: theme.body, fontSize: 12, letterSpacing: 1.5, textTransform: "uppercase",
            color: theme.accent2, marginBottom: 8 }}>Moods felt this watch</div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
            {stats.moods.map((m) => (
              <span key={m} style={{ background: theme.accent, color: theme.bg, borderRadius: 20,
                padding: "3px 11px", fontFamily: theme.body, fontSize: 12, fontWeight: 600 }}>{m}</span>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// Film detail view
// ═══════════════════════════════════════════════════════════════
function FilmView({ film, uid, onBack }) {
  const { theme } = film;
  const [data, setData] = useState(null);
  const [activeCat, setActiveCat] = useState("characters");
  const [adding, setAdding] = useState("");
  const [query, setQuery] = useState("");
  const [showStats, setShowStats] = useState(false);
  const [favOnly, setFavOnly] = useState(false);
  const [saving, setSaving] = useState(false);

  useEffect(() => { loadFilm(uid, film).then(setData); }, [film.id, uid]);

  const persist = useCallback((next) => {
    setData(next);
    setSaving(true);
    saveFilm(uid, film.id, next).finally(() => setSaving(false));
  }, [film.id, uid]);

  if (!data) return (
    <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center",
      background: theme.bg, color: theme.sub, fontFamily: theme.body, gap: 10 }}>
      <Loader size={18} color={theme.accent} style={{ animation: "spin .9s linear infinite" }} /> Loading…
    </div>
  );

  const isMoods = activeCat === "moods";
  const list = isMoods ? [] : (data[activeCat] || []);
  const catMeta = CATEGORIES.find((c) => c.key === activeCat);

  // ── Mood pill model ──
  const moodCustom = data.moodsCustom || [];
  const moodSelected = data.moodsSelected || [];
  const moodPills = [...SHARED_MOODS, ...moodCustom.filter((m) => !SHARED_MOODS.includes(m))];
  const toggleMood = (m) => {
    const next = moodSelected.includes(m) ? moodSelected.filter((x) => x !== m) : [...moodSelected, m];
    persist({ ...data, moodsSelected: next });
  };
  const addMood = () => {
    const m = adding.trim(); if (!m) return;
    const exists = moodPills.some((p) => p.toLowerCase() === m.toLowerCase());
    const nextCustom = exists ? moodCustom : [...moodCustom, m];
    const nextSel = moodSelected.includes(m) ? moodSelected : [...moodSelected, m];
    persist({ ...data, moodsCustom: nextCustom, moodsSelected: nextSel });
    setAdding("");
  };
  const clearMoods = () => persist({ ...data, moodsSelected: [] });

  const filtered = list.filter((e) => {
    if (favOnly && !e.favorite) return false;
    if (!query.trim()) return true;
    const q = query.toLowerCase();
    return e.name.toLowerCase().includes(q) || (e.note || "").toLowerCase().includes(q)
      || (e.tags || []).some((t) => t.toLowerCase().includes(q));
  });

  const addEntry = () => {
    const name = adding.trim(); if (!name) return;
    persist({ ...data, [activeCat]: [
      { id: `n-${Date.now()}`, name, rating: 0, note: "", favorite: false, tags: [] }, ...list] });
    setAdding("");
  };
  const update = (id, patch) => persist({ ...data,
    [activeCat]: list.map((e) => (e.id === id ? { ...e, ...patch } : e)) });
  const remove = (id) => persist({ ...data, [activeCat]: list.filter((e) => e.id !== id) });

  const rated = list.filter((e) => e.rating > 0);
  const avg = rated.length ? (rated.reduce((s, e) => s + e.rating, 0) / rated.length).toFixed(1) : "—";

  return (
    <div style={{ minHeight: "100vh", background: theme.bg, backgroundImage: theme.texture, color: theme.ink }}>
      <div style={{ maxWidth: 660, margin: "0 auto", padding: "20px 18px 60px" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 20 }}>
          <button onClick={onBack}
            style={{ display: "inline-flex", alignItems: "center", gap: 6, background: "none",
              border: `1px solid ${theme.panelBorder}`, color: theme.sub, borderRadius: 8,
              padding: "6px 12px", cursor: "pointer", fontFamily: theme.body, fontSize: 13 }}>
            <ChevronLeft size={15} /> All films
          </button>
          <span style={{ display: "inline-flex", alignItems: "center", gap: 6, fontFamily: theme.body,
            fontSize: 12, color: theme.sub, opacity: saving ? 1 : 0.5, transition: "opacity .2s" }}>
            <Cloud size={14} color={saving ? theme.accent : theme.sub} /> {saving ? "Saving…" : "Saved"}
          </span>
        </div>

        <div style={{ marginBottom: 4, fontFamily: theme.body, fontSize: 12, letterSpacing: 3,
          textTransform: "uppercase", color: theme.accent2 }}>{film.year}</div>
        <h1 style={{ fontFamily: theme.display, fontSize: 46, margin: "0 0 6px", fontWeight: 700,
          textTransform: film.upper ? "uppercase" : "none", letterSpacing: film.upper ? 1 : 0,
          color: theme.ink, textShadow: theme.glow, lineHeight: 1 }}>{film.title}</h1>
        <p style={{ fontFamily: theme.display, fontStyle: "italic", color: theme.sub, margin: "0 0 14px", fontSize: 17 }}>
          {film.tagline}
        </p>

        <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 14 }}>
          {film.genres.map((g) => (
            <span key={g} style={{ background: "rgba(0,0,0,0.3)", border: `1px solid ${theme.panelBorder}`,
              color: theme.accent2, borderRadius: 20, padding: "3px 12px", fontFamily: theme.body,
              fontSize: 12, letterSpacing: 0.3 }}>{g}</span>
          ))}
        </div>

        <p style={{ fontFamily: theme.body, fontSize: 14, lineHeight: 1.6, color: theme.ink,
          opacity: 0.9, margin: "0 0 18px", background: "rgba(0,0,0,0.2)",
          borderLeft: `3px solid ${theme.accent}`, borderRadius: "0 8px 8px 0", padding: "12px 14px" }}>
          {film.synopsis}
        </p>

        <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 18,
          background: theme.panel, border: `1px solid ${theme.panelBorder}`, borderRadius: 12, padding: "12px 16px" }}>
          <span style={{ fontFamily: theme.body, fontSize: 13, color: theme.sub }}>Overall film</span>
          <Stars value={data.filmRating || 0} onChange={(r) => persist({ ...data, filmRating: r === data.filmRating ? 0 : r })}
            accent={theme.accent} size={22} />
        </div>

        <button onClick={() => setShowStats((s) => !s)}
          style={{ display: "inline-flex", alignItems: "center", gap: 6, background: showStats ? theme.accent : theme.panel,
            border: `1px solid ${showStats ? theme.accent : theme.panelBorder}`, color: showStats ? theme.bg : theme.ink,
            borderRadius: 10, padding: "8px 14px", cursor: "pointer", fontFamily: theme.body,
            fontSize: 13, fontWeight: 600, marginBottom: 18 }}>
          <BarChart3 size={15} /> {showStats ? "Hide" : "Show"} stats dashboard
        </button>

        {showStats && <Dashboard data={data} theme={theme} />}

        <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
          {CATEGORIES.map((c) => {
            const Icon = c.icon; const on = activeCat === c.key;
            const count = c.key === "moods" ? (data.moodsSelected || []).length : (data[c.key] || []).length;
            return (
              <button key={c.key} onClick={() => { setActiveCat(c.key); setQuery(""); setFavOnly(false); }}
                style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 5,
                  background: on ? theme.accent : theme.panel,
                  border: `1px solid ${on ? theme.accent : theme.panelBorder}`,
                  color: on ? theme.bg : theme.ink, borderRadius: 10, padding: "12px 6px",
                  cursor: "pointer", fontFamily: theme.body, fontSize: 12.5, fontWeight: 600,
                  transition: "all .15s", boxShadow: on ? theme.glow : "none" }}>
                <Icon size={18} /> {c.label}
                <span style={{ fontSize: 11, opacity: 0.7 }}>{count}</span>
              </button>
            );
          })}
        </div>

        {isMoods ? (
          <div className="fadein">
            <div style={{ fontFamily: theme.body, fontSize: 13, color: theme.sub, margin: "2px 2px 14px", lineHeight: 1.5 }}>
              Tap what you feel as you watch. {moodSelected.length > 0
                ? <span style={{ color: theme.ink }}>{moodSelected.length} selected</span>
                : "Nothing selected yet."}
            </div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 18 }}>
              {moodPills.map((m) => {
                const on = moodSelected.includes(m);
                const custom = moodCustom.includes(m) && !SHARED_MOODS.includes(m);
                return (
                  <button key={m} onClick={() => toggleMood(m)}
                    style={{ background: on ? theme.accent : theme.panel,
                      border: `1px solid ${on ? theme.accent : (custom ? theme.accent2 : theme.panelBorder)}`,
                      color: on ? theme.bg : theme.ink, borderRadius: 22,
                      padding: "8px 16px", cursor: "pointer", fontFamily: theme.body,
                      fontSize: 14, fontWeight: on ? 700 : 500, letterSpacing: 0.2,
                      boxShadow: on ? theme.glow : "none", transition: "all .13s",
                      transform: on ? "translateY(-1px)" : "none" }}>
                    {m}
                  </button>
                );
              })}
            </div>
            <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
              <input value={adding} onChange={(e) => setAdding(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && addMood()} placeholder="Add your own mood…"
                style={{ flex: 1, background: theme.panel, border: `1px solid ${theme.panelBorder}`,
                  borderRadius: 10, color: theme.ink, fontFamily: theme.body, fontSize: 14, padding: "11px 14px" }} />
              <button onClick={addMood}
                style={{ display: "inline-flex", alignItems: "center", gap: 5, background: theme.accent,
                  border: "none", color: theme.bg, borderRadius: 10, padding: "0 16px",
                  cursor: "pointer", fontFamily: theme.body, fontSize: 14, fontWeight: 700 }}>
                <Plus size={16} /> Add
              </button>
            </div>
            {moodSelected.length > 0 && (
              <button onClick={clearMoods}
                style={{ display: "inline-flex", alignItems: "center", gap: 6, background: "none",
                  border: `1px solid ${theme.panelBorder}`, color: theme.sub, borderRadius: 10,
                  padding: "8px 14px", cursor: "pointer", fontFamily: theme.body, fontSize: 13 }}>
                <X size={14} /> Clear all selected
              </button>
            )}
          </div>
        ) : (
          <div className="fadein">
            <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
              <div style={{ flex: 1, position: "relative" }}>
                <Search size={15} color={theme.sub} style={{ position: "absolute", left: 12, top: "50%", transform: "translateY(-50%)" }} />
                <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder={`Search ${catMeta.label.toLowerCase()}…`}
                  style={{ width: "100%", boxSizing: "border-box", background: theme.panel,
                    border: `1px solid ${theme.panelBorder}`, borderRadius: 10, color: theme.ink,
                    fontFamily: theme.body, fontSize: 13.5, padding: "10px 12px 10px 34px" }} />
              </div>
              <button onClick={() => setFavOnly((f) => !f)} aria-label="Favorites only"
                style={{ display: "inline-flex", alignItems: "center", gap: 5, background: favOnly ? theme.accent : theme.panel,
                  border: `1px solid ${favOnly ? theme.accent : theme.panelBorder}`, color: favOnly ? theme.bg : theme.sub,
                  borderRadius: 10, padding: "0 14px", cursor: "pointer", fontFamily: theme.body, fontSize: 13, fontWeight: 600 }}>
                <Heart size={15} fill={favOnly ? theme.bg : "none"} color={favOnly ? theme.bg : "currentColor"} /> Faves
              </button>
            </div>

            <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
              <input value={adding} onChange={(e) => setAdding(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && addEntry()} placeholder={catMeta.prompt}
                style={{ flex: 1, background: theme.panel, border: `1px solid ${theme.panelBorder}`,
                  borderRadius: 10, color: theme.ink, fontFamily: theme.body, fontSize: 14, padding: "11px 14px" }} />
              <button onClick={addEntry}
                style={{ display: "inline-flex", alignItems: "center", gap: 5, background: theme.accent,
                  border: "none", color: theme.bg, borderRadius: 10, padding: "0 16px",
                  cursor: "pointer", fontFamily: theme.body, fontSize: 14, fontWeight: 700 }}>
                <Plus size={16} /> Add
              </button>
            </div>

            <div style={{ fontFamily: theme.body, fontSize: 12.5, color: theme.sub, margin: "6px 2px 16px",
              display: "flex", alignItems: "center", gap: 6 }}>
              <Star size={13} fill={theme.accent} strokeWidth={0} color={theme.accent} />
              Avg {catMeta.label.toLowerCase()} rating <b style={{ color: theme.ink }}>{avg}</b>
              <span style={{ opacity: 0.6 }}>· {filtered.length} shown</span>
            </div>

            {filtered.length === 0 ? (
              <div style={{ textAlign: "center", padding: "40px 20px", color: theme.sub,
                fontFamily: theme.body, fontSize: 14, border: `1px dashed ${theme.panelBorder}`, borderRadius: 12 }}>
                {query || favOnly ? "Nothing matches that filter." : `No ${catMeta.label.toLowerCase()} yet — add the first above.`}
              </div>
            ) : (
              filtered.map((e) => (
                <EntryCard key={e.id} entry={e} theme={theme}
                  onUpdate={(patch) => update(e.id, patch)} onDelete={() => remove(e.id)} />
              ))
            )}
          </div>
        )}
      </div>
    </div>
  );
}

// Home tile
// ═══════════════════════════════════════════════════════════════
function FilmTile({ film, uid, onOpen }) {
  const { theme } = film;
  const [meta, setMeta] = useState(null);
  useEffect(() => {
    loadFilm(uid, film).then((d) => {
      const all = [...d.characters, ...d.scenes];
      setMeta({ count: all.length, filmRating: d.filmRating || 0, moods: (d.moodsSelected || []).length });
    });
  }, [film.id, uid]);
  return (
    <button onClick={onOpen}
      style={{ position: "relative", textAlign: "left", cursor: "pointer",
        background: theme.panel, backgroundImage: theme.texture,
        border: `1px solid ${theme.panelBorder}`, borderRadius: 16, padding: 22,
        overflow: "hidden", transition: "transform .18s, box-shadow .18s", minHeight: 190 }}
      onMouseEnter={(e) => { e.currentTarget.style.transform = "translateY(-3px)"; e.currentTarget.style.boxShadow = theme.glow; }}
      onMouseLeave={(e) => { e.currentTarget.style.transform = "none"; e.currentTarget.style.boxShadow = "none"; }}>
      <div style={{ fontFamily: theme.body, fontSize: 11, letterSpacing: 3, textTransform: "uppercase",
        color: theme.accent2, marginBottom: 8 }}>{film.year}</div>
      <div style={{ fontFamily: theme.display, fontSize: 29, fontWeight: 700, color: theme.ink,
        lineHeight: 1.02, textShadow: theme.glow, textTransform: film.upper ? "uppercase" : "none" }}>{film.title}</div>
      <div style={{ fontFamily: theme.display, fontStyle: "italic", color: theme.sub, margin: "8px 0 10px", fontSize: 14 }}>
        {film.tagline}
      </div>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 5 }}>
        {film.genres.slice(0, 3).map((g) => (
          <span key={g} style={{ background: "rgba(0,0,0,0.28)", color: theme.sub, borderRadius: 20,
            padding: "2px 9px", fontFamily: theme.body, fontSize: 11 }}>{g}</span>
        ))}
      </div>
      <div style={{ position: "absolute", bottom: 16, right: 18, fontFamily: theme.body, fontSize: 12,
        color: theme.sub, display: "flex", alignItems: "center", gap: 10 }}>
        {meta && meta.filmRating > 0 && (
          <span style={{ display: "flex", alignItems: "center", gap: 3, color: theme.accent }}>
            <Star size={12} fill={theme.accent} strokeWidth={0} color={theme.accent} /> {meta.filmRating}
          </span>
        )}
        <span style={{ display: "flex", alignItems: "center", gap: 5 }}>
          <Film size={13} color={theme.accent} /> {meta === null ? "…" : `${meta.count} items`}
        </span>
      </div>
    </button>
  );
}

      <button onClick={onSignIn}
        style={{ display: "inline-flex", alignItems: "center", gap: 10, background: "#f0eef2",
          border: "none", color: "#060608", borderRadius: 12, padding: "13px 24px",
          cursor: "pointer", fontFamily: "'Inter', sans-serif", fontSize: 15, fontWeight: 700 }}>
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Sign in with Google
      </button>
      {error && <p style={{ color: "#ff6b6b", fontFamily: "'Inter', sans-serif", fontSize: 13, marginTop: 18 }}>{error}</p>}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// Main app
// ═══════════════════════════════════════════════════════════════
function App() {
  const [user, setUser] = useState(undefined); // undefined = checking, null = signed out
  const [authError, setAuthError] = useState("");
  const [open, setOpen] = useState(null);
  const [genreFilter, setGenreFilter] = useState(null);

  useEffect(() => {
    const unsub = window.VaultFirebase.onAuth((u) => setUser(u || null));
    return () => unsub && unsub();
  }, []);

  const doSignIn = () => {
    setAuthError("");
    window.VaultFirebase.signIn().catch((e) => setAuthError(e.message || "Sign-in failed."));
  };

  if (user === undefined) {
    return (
      <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center",
        background: "#060608", color: "#6a6a78", fontFamily: "'Inter', sans-serif", gap: 10 }}>
        <Loader size={18} color="#8a8a98" style={{ animation: "spin .9s linear infinite" }} /> Loading…
      </div>
    );
  }
  if (user === null) return <SignIn onSignIn={doSignIn} error={authError} />;

  if (open) return <FilmView film={FILMS[open]} uid={user.uid} onBack={() => setOpen(null)} />;

  const films = Object.values(FILMS).filter((f) => !genreFilter || f.genres.includes(genreFilter));

  return (
    <div style={{ minHeight: "100vh", background: "#060608",
      backgroundImage: "radial-gradient(circle at 15% 0%, rgba(255,45,85,0.06), transparent 40%), radial-gradient(circle at 85% 100%, rgba(46,166,255,0.06), transparent 40%)",
      color: "#f0eef2" }}>
      <div style={{ maxWidth: 740, margin: "0 auto", padding: "40px 18px 60px" }}>
        <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 12, marginBottom: 10 }}>
          <div style={{ fontFamily: "'Inter', sans-serif", fontSize: 12, letterSpacing: 4,
            textTransform: "uppercase", color: "#6a6a78" }}>Personal Cinema Ledger</div>
          <div style={{ display: "flex", alignItems: "center", gap: 10, flexShrink: 0 }}>
            {user.photoURL && <img src={user.photoURL} alt="" style={{ width: 26, height: 26, borderRadius: "50%" }} referrerPolicy="no-referrer" />}
            <button onClick={() => window.VaultFirebase.signOut()}
              style={{ display: "inline-flex", alignItems: "center", gap: 5, background: "none",
                border: "1px solid #2a2a32", color: "#8a8a98", borderRadius: 8, padding: "5px 11px",
                cursor: "pointer", fontFamily: "'Inter', sans-serif", fontSize: 12.5 }}>
              <LogOut size={13} /> Sign out
            </button>
          </div>
        </div>

        <h1 style={{ fontFamily: "'Oswald', sans-serif", fontSize: 52, fontWeight: 700, margin: "0 0 8px",
          letterSpacing: 0.5, lineHeight: 1 }}>THE VAULT</h1>
        <p style={{ fontFamily: "'Inter', sans-serif", color: "#8a8a98", fontSize: 15, margin: "0 0 26px",
          maxWidth: 480, lineHeight: 1.5 }}>
          Rate every character, scene, and mood, tag the patterns, and watch your taste take shape.
          Each film comes pre-loaded with its real cast and key moments. Everything syncs to your account.
        </p>

        <div style={{ display: "flex", flexWrap: "wrap", gap: 7, marginBottom: 28 }}>
          <button onClick={() => setGenreFilter(null)}
            style={{ background: genreFilter === null ? "#f0eef2" : "transparent",
              color: genreFilter === null ? "#060608" : "#8a8a98",
              border: "1px solid #2a2a32", borderRadius: 20, padding: "5px 14px",
              cursor: "pointer", fontFamily: "'Inter', sans-serif", fontSize: 12.5, fontWeight: 600 }}>All</button>
          {ALL_GENRES.map((g) => (
            <button key={g} onClick={() => setGenreFilter(g === genreFilter ? null : g)}
              style={{ background: genreFilter === g ? "#f0eef2" : "transparent",
                color: genreFilter === g ? "#060608" : "#8a8a98",
                border: "1px solid #2a2a32", borderRadius: 20, padding: "5px 14px",
                cursor: "pointer", fontFamily: "'Inter', sans-serif", fontSize: 12.5, fontWeight: 600 }}>{g}</button>
          ))}
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(290px, 1fr))", gap: 16 }}>
          {films.map((f) => <FilmTile key={f.id} film={f} uid={user.uid} onOpen={() => setOpen(f.id)} />)}
        </div>
        {films.length === 0 && (
          <div style={{ textAlign: "center", padding: 40, color: "#6a6a78", fontFamily: "'Inter', sans-serif" }}>
            No films in that genre yet.
          </div>
        )}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// Boot — wait until the Firebase module bridge is ready
// ═══════════════════════════════════════════════════════════════
function boot() {
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
}
if (window.VaultFirebase) boot();
else window.addEventListener("vault-firebase-ready", boot, { once: true });
</script>
</body>
</html>
